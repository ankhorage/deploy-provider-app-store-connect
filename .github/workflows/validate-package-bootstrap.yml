name: Validate Package Bootstrap

on:
  push:
    branches:
      - feat/app-store-connect-deployment-provider

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[package-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run build
      - run: bunx @ankhorage/ankh doctor validate .
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet bun.lock; then
            exit 0
          fi
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: validate package bootstrap [package-validated]"
          git push origin HEAD:feat/app-store-connect-deployment-provider
