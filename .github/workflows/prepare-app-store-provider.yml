name: Prepare App Store Provider

on:
  push:
    branches:
      - feat/app-store-connect-deployment-provider

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Apply compile-safe provider normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('src/features/ios-publication/adapters/outbound/createAppStoreConnectIosPublisher.ts'),
              Path('src/features/monetization/adapters/outbound/createAppStoreConnectMonetizationAdapter.ts'),
              Path('src/features/release/adapters/outbound/createAppStoreConnectReleaseAdapter.ts'),
              Path('src/features/store-listing/adapters/outbound/createAppStoreConnectStoreListingAdapter.ts'),
          ]
          old = "): ReturnType<AppStoreConnectRuntime['request']> | Promise<null> {"
          new = "): Promise<Awaited<ReturnType<AppStoreConnectRuntime['request']>> | null> {"
          for path in paths:
              text = path.read_text()
              text = text.replace(old, new)
              path.write_text(text)

          listing = paths[-1]
          text = listing.read_text()
          replacement = '''function mergeLocales(
            appInfo: readonly Resource[],
            version: readonly Resource[],
          ): readonly StoreListingLocale[] {
            const locales = [...new Set([...appInfo, ...version].map((item) => item.locale))].sort();
            return locales.map((locale) => {
              const info = appInfo.find((item) => item.locale === locale)?.attributes;
              const ver = version.find((item) => item.locale === locale)?.attributes;
              const summary = readString(info?.subtitle);
              const privacyPolicyUrl = readString(info?.privacyPolicyUrl);
              const description = readString(ver?.description);
              const keywords = readString(ver?.keywords);
              const promotionalText = readString(ver?.promotionalText);
              const supportUrl = readString(ver?.supportUrl);
              const marketingUrl = readString(ver?.marketingUrl);
              return {
                locale,
                name: readString(info?.name) ?? locale,
                ...(summary === undefined ? {} : { summary }),
                ...(privacyPolicyUrl === undefined ? {} : { privacyPolicyUrl }),
                ...(description === undefined ? {} : { description }),
                ...(keywords === undefined
                  ? {}
                  : { keywords: keywords.split(',').map((item) => item.trim()).filter(Boolean) }),
                ...(promotionalText === undefined ? {} : { promotionalText }),
                ...(supportUrl === undefined ? {} : { supportUrl }),
                ...(marketingUrl === undefined ? {} : { marketingUrl }),
              };
            });
          }

          /*** Reads screenshot sets and their uploaded asset checksums. */'''
          text, count = re.subn(
              r"function mergeLocales\([\s\S]*?\n\}\n\n/\*\*\* Reads screenshot sets and their uploaded asset checksums\. \*/",
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('mergeLocales replacement did not match exactly once')
          text = text.replace(
              "return values.every((value): value is StoreListingRemoteAssetSet => value !== null) ? values : null;",
              "return values.some((value) => value === null)\n    ? null\n    : values.filter((value) => value !== null);",
          )
          listing.write_text(text)
          PY
      - run: bun run lint:fix || true
      - run: bun run format
      - run: bun run docs
      - run: bun run build
      - run: bun run test
      - run: bun run typecheck
      - name: Commit prepared source and generated documentation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: prepare App Store Connect provider [prepared]"
          git push origin HEAD:feat/app-store-connect-deployment-provider
