name: Prepare Final Provider

on:
  push:
    branches:
      - feat/app-store-connect-deployment-provider

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[final-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run lint:fix
      - run: bun run format
      - run: bun run docs
      - run: bun run build
      - run: bun run check-types
      - run: bun run test
      - name: Commit generated preparation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: prepare final provider [final-prepared]"
          git push origin HEAD:feat/app-store-connect-deployment-provider
