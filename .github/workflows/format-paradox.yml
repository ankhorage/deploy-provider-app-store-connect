name: Format Paradox

on:
  push:
    branches:
      - feat/app-store-connect-deployment-provider

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[paradox-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run docs
      - run: bun run format
      - run: bun run format:check
      - name: Commit formatted Paradox output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: format Paradox output [paradox-formatted]"
          git push origin HEAD:feat/app-store-connect-deployment-provider
