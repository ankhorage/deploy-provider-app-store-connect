name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Create the scoped release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node for npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Version packages directly on main
        id: release
        run: |
          git fetch origin main
          git checkout -B main origin/main
          if [ -z "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)" ]; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun run version-packages
          if git diff --quiet; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(release): version packages [skip ci]"
          git push origin HEAD:main
          echo "versioned=true" >> "$GITHUB_OUTPUT"

      - name: Publish unpublished packages
        run: bun run changeset -- publish

      - name: Finalize tags and GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --points-at HEAD | while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            git push origin "refs/tags/$tag"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes
            fi
          done
